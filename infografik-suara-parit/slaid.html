<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slaid Suara Parit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE formal, berwibawa: dek taklimat Ahli Parlimen, satu perkara satu slaid, ruang lega
   IDEA fail parlimen digital: setiap slaid satu rekod, disusun seperti bab laporan rasmi
   PICTURE potret YB pada slaid tajuk; setiap slaid data mempunyai grafik sendiri (palang, garis masa, cip kampung)
   COLOUR navy #061226 ke zamrud #04392f, cyan #46d9e6 untuk data, emas #d9b45a untuk angka penting dan sorotan
   TYPE Plus Jakarta Sans 800 untuk tajuk dan angka, 400-600 untuk teks
   LAYOUT pentas 1600x900 berskala; bar navigasi di bawah. Di bawah 900px slaid disusun menegak tanpa animasi masuk */
:root{color-scheme:dark;--navy:#061226;--em:#04392f;--cy:#46d9e6;--gold:#d9b45a;--vio:#c9b7ff;--ink:#eef4f6;--mute:#a9bdc7;--line:rgba(70,217,230,.22);--glass:rgba(12,32,58,.55)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 85% 100%,#05473a 0%,rgba(4,57,47,0) 55%),linear-gradient(150deg,#040c1c 0%,var(--navy) 45%,#062a2f 100%);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;overflow:hidden}
a{color:var(--cy)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden}
.bg{position:absolute;inset:0;pointer-events:none}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(70,217,230,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(70,217,230,.05) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(90% 80% at 40% 40%,#000 30%,transparent 85%);-webkit-mask-image:radial-gradient(90% 80% at 40% 40%,#000 30%,transparent 85%)}
.bg svg{position:absolute;inset:0;width:100%;height:100%}
.ln{fill:none;stroke:var(--cy);stroke-width:1;opacity:.26;stroke-dasharray:6 18;animation:flow 26s linear infinite}
.ln.g{stroke:var(--gold);opacity:.16;animation-duration:38s}
@keyframes flow{to{stroke-dashoffset:-480}}
.top{position:absolute;left:56px;right:56px;top:30px;display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--mute);z-index:2}
.top b{color:var(--gold);font-weight:600;display:flex;align-items:center;gap:9px}
.top svg{width:18px;height:18px}
.slide{position:absolute;inset:0;padding:84px 56px 96px;opacity:0;visibility:hidden;transform:translateX(48px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1),visibility 0s .6s}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1),visibility 0s}
.slide.past{transform:translateX(-48px)}
.panel{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015)),var(--glass);border:1px solid var(--line);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.lbl{display:block;font-size:15px;font-weight:700;color:var(--cy);margin:0 0 8px}
h2{margin:0;font-size:54px;line-height:1.05;letter-spacing:-.025em;font-weight:800;text-wrap:balance}
.lead{font-size:22px;line-height:1.45;color:#d3e0e6;margin:16px 0 0;max-width:34em}
.na{color:var(--mute);font-style:italic}
/* efek masuk: hanya pada slaid aktif */
.a{opacity:0}
.on .a{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 1s)}
.on .a.l{animation-name:fromL}
.on .a.p{animation-name:pop;animation-duration:.45s}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fromL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
/* slaid tajuk */
.cover{display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:40px;align-items:center}
.cover h1{margin:0;font-size:96px;line-height:1;letter-spacing:-.03em;font-weight:800;background:linear-gradient(100deg,var(--ink) 0 42%,#fff 47%,#9ff3fa 50%,#fff 53%,var(--ink) 58% 100%);background-size:260% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent}
.on .cover h1{animation:sweep .8s .3s ease-out both}
@keyframes sweep{from{background-position:100% 0}to{background-position:0 0}}
.cover .sub{font-size:30px;color:var(--mute);margin:22px 0 0;font-weight:500}
.cover .sub b{color:var(--cy);font-weight:600}
.namep{margin-top:44px;padding:20px 26px;border-top:2px solid var(--gold);max-width:620px}
.namep strong{display:block;font-size:34px;line-height:1.15}
.namep span{display:block;font-size:19px;color:#d5e1e7}
.namep em{display:block;font-style:normal;color:var(--gold);font-weight:700;font-size:19px;margin-top:4px}
.port{position:relative;height:740px;align-self:end;display:flex;justify-content:center;align-items:flex-end;margin-bottom:-96px}
.port .star{position:absolute;left:50%;top:42%;width:500px;height:500px;transform:translate(-50%,-50%);opacity:.3}
.on .port .star{animation:spin 90s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.star rect{fill:none;stroke:var(--gold);stroke-width:.5}
.port .glow{position:absolute;left:50%;bottom:0;width:560px;height:560px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(70,217,230,.22),rgba(4,57,47,.15) 60%,transparent);border-radius:50%}
.port img{position:relative;height:100%;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
/* ringkasan angka */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:56px}
.big{padding:34px 32px 30px}
.big .n{display:block;font-size:150px;line-height:.95;font-weight:800;color:var(--cy);font-variant-numeric:tabular-nums}
.big strong{display:block;font-size:26px;margin-top:14px}
.big span{display:block;font-size:18px;color:var(--mute);margin-top:4px}
.note{font-size:16px;color:var(--mute);margin-top:28px}
/* palang tahun */
.yr{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:48px;margin-top:44px;align-items:start}
.bars{display:grid;gap:26px}
.bar{display:grid;grid-template-columns:90px minmax(0,1fr) 80px;align-items:center;gap:20px;font-size:26px;font-weight:700}
.bar .tr{height:54px;border-radius:10px;background:rgba(255,255,255,.04);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,#0a5a4a,var(--cy));transition:width .8s cubic-bezier(.2,.7,.2,1)}
.bar.top1 i{background:linear-gradient(90deg,#8a6a22,var(--gold))}
.on .bar i{width:var(--w)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.side{padding:26px}
.side p{margin:0 0 14px;font-size:18px;line-height:1.5;color:#d3e0e6}
.side b{color:var(--gold)}
/* senarai 33 */
.vlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 28px;margin-top:26px}
.vr{display:grid;grid-template-columns:30px 104px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px;line-height:1.3}
.vr .i{color:var(--mute)}.vr .t{color:var(--cy);white-space:nowrap}
.vr.hit .x{color:var(--gold);font-weight:600}
/* garis masa Kamar Khas */
.tl{position:relative;margin-top:44px}
.tl svg{position:absolute;left:0;top:0;width:100%;height:40px;overflow:visible}
.tl path{stroke:var(--cy);stroke-width:2;fill:none;stroke-dasharray:1600;stroke-dashoffset:1600;opacity:.7}
.on .tl path{transition:stroke-dashoffset 1.6s .2s ease-out;stroke-dashoffset:0}
.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;position:relative}
.node{width:22px;height:22px;border-radius:50%;background:var(--navy);border:3px solid var(--gold);margin:9px 0 0 0;box-shadow:0 0 14px rgba(217,180,90,.5)}
.node.u{border-style:dashed;border-color:var(--mute);box-shadow:none}
.col h3{margin:14px 0 12px;font-size:20px;line-height:1.2}
.col h3 small{display:block;font-size:14px;color:var(--mute);font-weight:500}
.kk{padding:14px 15px;margin-bottom:12px}
.kk b{display:block;font-size:13px;color:var(--gold);margin-bottom:4px}
.kk p{margin:0;font-size:16px;line-height:1.35;font-weight:600}
.kk span{display:block;font-size:14px;color:var(--mute);margin-top:6px}
/* slaid isu */
.iss{display:grid;grid-template-columns:540px minmax(0,1fr);gap:48px;height:100%;align-items:center}
.ico{width:76px;height:76px;border-radius:20px;display:grid;place-items:center;background:rgba(70,217,230,.1);border:1px solid rgba(70,217,230,.35);box-shadow:0 0 0 0 rgba(70,217,230,.4)}
.on .ico{animation:ring 1.6s .5s ease-out 1}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(70,217,230,.45)}100%{box-shadow:0 0 0 22px rgba(70,217,230,0)}}
.ico svg{width:40px;height:40px;fill:none;stroke:var(--cy);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cat{display:block;margin:22px 0 10px;color:var(--gold);font-weight:600;font-size:17px}
.iss .lead{font-size:20px}
.kf{display:flex;align-items:baseline;gap:16px;margin-top:28px}
.kf b{font-size:110px;line-height:.9;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.kf span{font-size:19px;color:var(--mute);max-width:11em;line-height:1.3}
.loc{margin-top:26px;font-size:16px;line-height:1.5;color:#d3e0e6}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid rgba(70,217,230,.4);background:rgba(70,217,230,.08);font-size:15px;white-space:nowrap}
.rt{display:flex;flex-direction:column;gap:14px;min-height:0}
.box{padding:16px 20px}
.box ul{margin:0;padding-left:20px}
.box li{font-size:16px;line-height:1.42;color:#dbe6eb;margin:3px 0}
.box p{margin:0;font-size:16px;line-height:1.45;color:#dbe6eb}
.recs{display:grid;gap:8px}
.rec{display:grid;grid-template-columns:150px 140px minmax(0,1fr);gap:12px;align-items:baseline;font-size:15.5px;line-height:1.35}
.rec b{white-space:nowrap}
.ty{justify-self:start;font-size:13px;padding:2px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.ty.dr{color:var(--cy);border-color:rgba(70,217,230,.55)}.ty.kk{color:var(--gold);border-color:rgba(217,180,90,.55)}.ty.tn{color:var(--mute);border-color:rgba(169,189,199,.45)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.box.y .lbl{color:var(--cy)}.box.k .lbl{color:var(--vio)}.box.t .lbl{color:var(--gold)}
.src{font-size:14px;color:var(--mute);line-height:1.45}
.src a{display:inline-block}
.flag{padding:9px 14px;border-radius:10px;border:1px dashed rgba(217,180,90,.6);background:rgba(217,180,90,.07);font-size:14px;color:#f1e3bd;line-height:1.4}
/* sorotan */
.hlq{font-size:40px;line-height:1.25;font-weight:700;margin:22px 0 0;max-width:30em;text-wrap:balance}
.flowc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:56px;margin-top:52px;position:relative}
.fc{padding:28px 28px 30px;position:relative}
.fc .lbl{font-size:18px}
.fc p{margin:0;font-size:22px;line-height:1.45}
.fc.y{border-color:rgba(70,217,230,.5)}.fc.k{border-color:rgba(201,183,255,.45)}.fc.k .lbl{color:var(--vio)}.fc.t{border-color:rgba(217,180,90,.55)}.fc.t .lbl{color:var(--gold)}
.fc+.fc::before{content:"";position:absolute;left:-46px;top:50%;width:36px;height:2px;background:linear-gradient(90deg,transparent,var(--mute))}
.fc+.fc::after{content:"";position:absolute;left:-16px;top:calc(50% - 5px);border:6px solid transparent;border-left-color:var(--mute)}
/* galeri Dewan Rakyat */
.gal{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;margin-top:20px;height:550px}
.hero{margin:0;position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#020814}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;opacity:0;transition:opacity .8s ease}
.hero img.on{opacity:1}
.on .hero img.on{animation:kb 7s ease-out both}
@keyframes kb{from{transform:scale(1.07)}to{transform:scale(1)}}
.hero figcaption{position:absolute;left:0;right:0;bottom:0;padding:44px 24px 18px;background:linear-gradient(transparent,rgba(2,8,20,.92));font-size:17px;line-height:1.4}
.hero figcaption b{display:block;font-size:22px;color:var(--gold)}
.thumbs{display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:10px}
.th{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center;text-align:left;padding:6px;border-radius:12px;border:1px solid var(--line);background:var(--glass);transition:border-color .4s,box-shadow .4s}
.th img{width:150px;height:100%;max-height:84px;object-fit:cover;object-position:50% 30%;border-radius:8px;display:block}
.th span{font-size:14px;line-height:1.3;color:#d5e1e7}
.th span b{display:block;color:var(--ink);font-size:15px}
.th[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 18px rgba(217,180,90,.25)}
.th:hover{border-color:var(--cy)}
.credit{font-size:14px;color:var(--mute);margin-top:12px}
.hlrow{display:grid;grid-template-columns:minmax(0,1fr) 500px;gap:40px;align-items:start}
.hlpic{margin:0;border-radius:16px;overflow:hidden;border:1px solid rgba(217,180,90,.45);height:290px;position:relative}
.hlpic img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;display:block}
.on .hlpic img{animation:kb 7s ease-out both}
.hlpic figcaption{position:absolute;left:0;right:0;bottom:0;padding:24px 14px 10px;background:linear-gradient(transparent,rgba(2,8,20,.9));font-size:14px}
html.still .hero img,html.still .hlpic img{animation:none!important;transition:none}
html.flow .gal{grid-template-columns:minmax(0,1fr);height:auto}
html.flow .hero{height:260px}
html.flow .thumbs{grid-template-rows:none}
html.flow .hlrow{grid-template-columns:minmax(0,1fr)}
html.flow .hlpic{height:220px}
/* motion grafik data */
.units{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.units i{display:block;width:12px;height:30px;border-radius:3px;background:var(--cy);opacity:.85}
.units.dot i{width:16px;height:16px;border-radius:50%;background:var(--gold)}
.units.dot i.u{background:none;border:2px dashed var(--mute)}
.units.yr4 i{width:auto;height:auto;padding:5px 12px;border-radius:8px;background:rgba(70,217,230,.14);border:1px solid rgba(70,217,230,.5);font-style:normal;font-size:15px;font-weight:700;color:var(--cy)}
.units.sm i{width:14px;height:14px;border-radius:50%;background:var(--gold)}
.recs{position:relative;padding-left:26px}
.recs::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--cy),var(--gold));transform-origin:top;transform:scaleY(0)}
.on .recs::before{transition:transform .8s .5s ease-out;transform:scaleY(1)}
.rec{position:relative}
.rec::before{content:"";position:absolute;left:-26px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--navy);border:2px solid var(--cy)}
.gap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;margin-top:40px;font-size:18px}
.gap .pt{display:flex;flex-direction:column;gap:2px}
.gap .pt b{font-size:22px}
.gap .pt span{color:var(--mute);font-size:15px}
.gap .ln2{position:relative;height:40px}
.gap .ln2::before{content:"";position:absolute;left:0;right:0;top:19px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--cy),var(--gold));transform-origin:left;transform:scaleX(0)}
.on .gap .ln2::before{transition:transform .9s .6s ease-out;transform:scaleX(1)}
.gap .ln2 em{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-style:normal;color:var(--gold);font-weight:700;white-space:nowrap}
html.still .recs::before,html.still .gap .ln2::before{transition:none!important}
html.flow .recs::before,html.flow .gap .ln2::before{transform:none}
html.flow .gap{grid-template-columns:minmax(0,1fr)}
/* sumber */
.srcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:34px}
.srcs ul{margin:0;padding-left:20px}
.srcs li{font-size:16px;line-height:1.5;margin:4px 0;color:#dbe6eb}
/* bar navigasi */
.nav{position:absolute;left:56px;right:56px;bottom:24px;display:flex;align-items:center;gap:14px;z-index:3}
.nb{min-height:44px;min-width:44px;padding:8px 16px;border-radius:999px;border:1px solid rgba(70,217,230,.45);background:rgba(70,217,230,.08);font-size:15px;font-weight:600;white-space:nowrap;transition:background .4s,border-color .4s}
.nb:hover{background:rgba(70,217,230,.2);border-color:var(--cy)}
.nb:disabled{opacity:.35;cursor:default}
.prog{flex:1;display:flex;gap:6px;align-items:center}
.prog button{flex:1;height:44px;border:0;background:none;padding:0;position:relative}
.prog button::before{content:"";position:absolute;left:0;right:0;top:20px;height:4px;border-radius:2px;background:rgba(255,255,255,.14);transition:background .4s}
.prog button.done::before{background:rgba(70,217,230,.55)}
.prog button.cur::before{background:var(--gold);height:6px;top:19px}
.cnt{font-variant-numeric:tabular-nums;color:var(--mute);font-size:15px;min-width:4.5em;text-align:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0b2140;border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .4s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
/* jeda dan kurang gerakan */
html.still .a{animation:none!important;opacity:1}
html.still .cover h1{animation:none;background-position:0 0}
html.still .ln,html.still .port .star{animation-play-state:paused}
html.still .ico{animation:none}
html.still .slide,html.still .bar i,html.still .tl path{transition:none!important}
@media (prefers-reduced-motion:reduce){.hero img,.hlpic img{animation:none!important}.recs::before,.gap .ln2::before{transition:none!important}.slide,.bar i,.tl path{transition:none!important}.on .a{animation:none;opacity:1}.ln,.on .port .star,.on .ico,.on .cover h1{animation:none}.cover h1{background-position:0 0}}
/* susunan menegak untuk skrin sempit */
html.flow,html.flow body{height:auto;min-height:100%}
html.flow body{overflow:auto;background-attachment:fixed}
html.flow .stage{position:relative;left:auto;top:auto;width:auto;height:auto;transform:none;overflow:visible;overflow-x:clip}
html.flow .nav{display:none}
html.flow .top{position:static;padding:18px 16px 0}
html.flow .slide{position:relative;opacity:1;visibility:visible;transform:none;padding:36px 16px;border-bottom:1px solid var(--line);transition:none}
html.flow .a{opacity:1;animation:none!important}
html.flow .bar i{width:var(--w);transition:none}
html.flow .tl path{stroke-dashoffset:0}
html.flow .tl svg{display:none}
html.flow h2{font-size:clamp(30px,8vw,44px)}
html.flow .cover,html.flow .iss,html.flow .yr{grid-template-columns:minmax(0,1fr);gap:24px}
html.flow .cover h1{font-size:clamp(40px,11vw,72px);background-position:0 0}
html.flow .cover .sub{font-size:20px}
html.flow .port{height:380px;margin:0}
html.flow .trio,html.flow .flowc,html.flow .srcs,html.flow .two,html.flow .vlist{grid-template-columns:minmax(0,1fr);gap:16px}
html.flow .big .n{font-size:88px}
html.flow .cols{grid-template-columns:minmax(0,1fr)}
html.flow .fc+.fc::before,html.flow .fc+.fc::after{display:none}
html.flow .hlq{font-size:26px}
html.flow .kf b{font-size:80px}
html.flow .rec{grid-template-columns:minmax(0,1fr)}
html.flow .bar{grid-template-columns:60px minmax(0,1fr) 44px;font-size:20px}
@media print{
 @page{size:A4 landscape;margin:0}
 html,body{height:auto;overflow:visible;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .stage,html.flow .stage{position:relative;left:0;top:0;transform:none;width:1600px;height:auto;overflow:visible;zoom:.66}
 .top,.nav,.toast{display:none!important}

const $=id=>document.getElementById(id), root=document.documentElement;
$('deck').innerHTML=SL.map((s,i)=>`<section class="slide" id="s${i+1}" aria-label="Slaid ${i+1}: ${s[0]}">${s[1]}</section>`).join('');
const slides=[...document.querySelectorAll('.slide')], N=slides.length;
$('prog').innerHTML=SL.map((s,i)=>`<button type="button" aria-label="Pergi ke slaid ${i+1}: ${s[0]}"></button>`).join('');
const pb=[...$('prog').children];
if(matchMedia('(prefers-reduced-motion: reduce)').matches) root.classList.add('still');

let cur=-1,raf=0;
function counts(sl){cancelAnimationFrame(raf);const ns=[...sl.querySelectorAll('[data-to]')];if(!ns.length)return;
 const fin=()=>ns.forEach(n=>n.textContent=n.dataset.to);
 if(root.classList.contains('still')||root.classList.contains('flow'))return fin();
 ns.forEach(n=>n.textContent='0');const t0=performance.now()+400,D=800;
 const step=now=>{if(root.classList.contains('still'))return fin();const p=Math.min(1,Math.max(0,(now-t0)/D)),e=1-(1-p)**3;ns.forEach(n=>n.textContent=Math.round(+n.dataset.to*e));if(p<1)raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}
function go(i,push=true){i=Math.max(0,Math.min(N-1,i));if(i===cur)return;
 slides.forEach((s,j)=>{s.classList.toggle('on',j===i);s.classList.toggle('past',j<i);s.setAttribute('aria-hidden',j===i?'false':'true');if(j===i)s.removeAttribute('inert');else s.setAttribute('inert','')});
 cur=i;pb.forEach((b,j)=>{b.classList.toggle('done',j<i);b.classList.toggle('cur',j===i);b.setAttribute('aria-current',j===i?'step':'false')});
 $('cnt').textContent=`${i+1} / ${N}`;$('sec').textContent=SL[i][0];$('prev').disabled=i===0;$('next').disabled=i===N-1;
 if(push&&location.hash!=='#s'+(i+1))history.replaceState(null,'','#s'+(i+1));counts(slides[i]);gauto(SL[i][0]==='Di Dewan Rakyat')}
$('prev').addEventListener('click',()=>go(cur-1));$('next').addEventListener('click',()=>go(cur+1));
pb.forEach((b,j)=>b.addEventListener('click',()=>go(j)));
document.addEventListener('keydown',e=>{if(root.classList.contains('flow')||e.target.closest('a'))return;
 const k=e.key;if(k==='ArrowRight'||k==='PageDown'||(k===' '&&!e.target.closest('button'))){e.preventDefault();go(cur+1)}else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(cur-1)}else if(k==='Home')go(0);else if(k==='End')go(N-1)});
let tx=null;$('stage').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('stage').addEventListener('touchend',e=>{if(tx==null||root.classList.contains('flow'))return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)go(cur+(dx<0?1:-1));tx=null});
const gimgs=()=>[...document.querySelectorAll('.hero img')],gth=()=>[...document.querySelectorAll('.th')];let gi=0,gt=0;
function gshow(i){gi=(i+PH.length)%PH.length;gimgs().forEach((im,j)=>im.classList.toggle('on',j===gi));gth().forEach((b,j)=>b.setAttribute('aria-pressed',String(j===gi)));$('gcap1').textContent=PH[gi][1];$('gcap2').textContent=PH[gi][2]}
document.addEventListener('click',e=>{const b=e.target.closest('.th');if(b){gshow(+b.dataset.g);clearInterval(gt);gt=0}});
function gauto(on){clearInterval(gt);gt=0;if(on&&!root.classList.contains('still')&&!root.classList.contains('flow'))gt=setInterval(()=>gshow(gi+1),6000)}
function fromHash(){const m=/^#s(\d+)$/.exec(location.hash);go(m?+m[1]-1:0,false)}
addEventListener('hashchange',fromHash);

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)}
function syncPause(){const s=root.classList.contains('still');$('pause').textContent=s?'Sambung animasi':'Jeda animasi';$('pause').setAttribute('aria-pressed',String(s))}
$('pause').addEventListener('click',()=>{root.classList.toggle('still');if(cur>=0){counts(slides[cur]);gauto(SL[cur][0]==='Di Dewan Rakyat')}syncPause()});syncPause();
$('fs').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await root.requestFullscreen()}catch(err){toast('Skrin penuh disekat oleh paparan ini. Buka artifak dalam tab sendiri atau tekan F11.')}});
document.addEventListener('fullscreenchange',()=>{$('fs').textContent=document.fullscreenElement?'Keluar skrin penuh':'Skrin penuh';fit()});

function fit(){const w=innerWidth,h=innerHeight,flow=w<900||w/h<1.05,was=root.classList.contains('flow');root.classList.toggle('flow',flow);
 if(flow){slides.forEach(s=>{s.removeAttribute('inert');s.setAttribute('aria-hidden','false')});document.querySelectorAll('[data-to]').forEach(n=>n.textContent=n.dataset.to)}
 else{$('stage').style.setProperty('--s',Math.min(w/1600,h/900).toFixed(4));if(was){const c=cur;cur=-1;go(Math.max(c,0),false)}}}
const ro=new ResizeObserver(fit);ro.observe(root);
fromHash();fit();
}
</script>
