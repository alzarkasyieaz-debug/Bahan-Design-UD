<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infografik Suara Parit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE formal, berwibawa: infografik rekod parlimen seorang Ahli Parlimen
   IDEA poster maklumat panjang: dibaca dari atas ke bawah seperti laporan bergambar, setiap bahagian satu dapatan
   PICTURE potret YB di kepala; carta lajur tahunan, garis masa tulang belakang, donat kementerian, jubin isu, galeri dewan
   COLOUR navy #061226 ke zamrud #04392f, cyan #46d9e6 untuk data video, emas #d9b45a untuk Kamar Khas dan sorotan
   TYPE Plus Jakarta Sans 800 tajuk dan angka, 400-600 teks
   LAYOUT lajur kandungan 1160px; bahagian dua lajur di laptop, satu lajur di telefon */
:root{color-scheme:dark;--navy:#061226;--em:#04392f;--cy:#46d9e6;--gold:#d9b45a;--vio:#c9b7ff;--ink:#eef4f6;--mute:#a9bdc7;--line:rgba(70,217,230,.22);--glass:rgba(12,32,58,.6)}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#040c1c 0%,var(--navy) 25%,#062a2f 55%,#061226 80%,#04261f 100%);color:var(--ink);font:17px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip}
a{color:var(--cy)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
img{max-width:100%}
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0}
.bgfx .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(70,217,230,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(70,217,230,.045) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(80% 70% at 50% 40%,#000 20%,transparent 85%);-webkit-mask-image:radial-gradient(80% 70% at 50% 40%,#000 20%,transparent 85%)}
.bgfx svg{position:absolute;inset:0;width:100%;height:100%}
.ln{fill:none;stroke:var(--cy);stroke-width:1;opacity:.22;stroke-dasharray:6 18;animation:flow 28s linear infinite}
.ln.g{stroke:var(--gold);opacity:.14;animation-duration:40s}
@keyframes flow{to{stroke-dashoffset:-480}}
main{position:relative;z-index:1}
.wrap{max-width:1160px;margin:0 auto;padding:0 max(4vw,16px)}
section{padding:clamp(56px,8vw,104px) 0;border-top:1px solid rgba(70,217,230,.1)}
.kick{display:block;color:var(--gold);font-weight:700;font-size:16px;margin-bottom:10px}
h2{margin:0;font-size:clamp(30px,4.4vw,48px);line-height:1.08;letter-spacing:-.02em;font-weight:800;text-wrap:balance;max-width:22ch}
.intro{color:#cfdde4;font-size:18px;max-width:62ch;margin:14px 0 0}
.panel{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015)),var(--glass);border:1px solid var(--line);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.na{color:var(--mute);font-style:italic}
.note{font-size:14px;color:var(--mute);margin-top:16px}
/* muncul ketika ditatal */
.rv{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--d,0) * 1s)}
.rv.l{transform:translateX(-36px)}.rv.r{transform:translateX(36px)}.rv.z{transform:scale(.85)}
.in .rv,.rv.in{opacity:1;transform:none}
/* kepala */
.hero{padding:clamp(40px,6vw,72px) 0 0;border:0}
.hgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:32px;align-items:end}
.badge{display:inline-flex;align-items:center;gap:10px;color:var(--gold);font-weight:600;font-size:16px}
.badge svg{width:20px;height:20px}
h1{margin:16px 0 0;font-size:clamp(44px,7.4vw,96px);line-height:.98;letter-spacing:-.03em;font-weight:800;background:linear-gradient(100deg,var(--ink) 0 42%,#fff 47%,#9ff3fa 50%,#fff 53%,var(--ink) 58% 100%);background-size:260% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 1.1s .3s ease-out both}
@keyframes sweep{to{background-position:0 0}}
.hsub{font-size:clamp(19px,2.2vw,26px);color:var(--mute);margin:18px 0 0;font-weight:500}
.hsub b{color:var(--cy);font-weight:600}
.namep{margin:30px 0 clamp(30px,5vw,60px);padding:18px 22px;border-top:2px solid var(--gold);max-width:520px}
.namep strong{display:block;font-size:28px;line-height:1.15}
.namep span{display:block;color:#d5e1e7}
.namep em{display:block;font-style:normal;color:var(--gold);font-weight:700;margin-top:4px}
.port{position:relative;display:flex;justify-content:center;align-items:flex-end;height:clamp(380px,48vw,600px)}
.port img{position:relative;height:100%;width:auto;object-fit:contain;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45));transform:translateY(var(--py,0px))}
.port .star{position:absolute;left:50%;top:42%;width:min(460px,90%);aspect-ratio:1;transform:translate(-50%,-50%);opacity:.3;animation:spin 90s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.star rect{fill:none;stroke:var(--gold);stroke-width:.5}
.port .glow{position:absolute;left:50%;bottom:0;width:min(520px,100%);aspect-ratio:1;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(70,217,230,.22),rgba(4,57,47,.15) 60%,transparent);border-radius:50%}
.scrollcue{display:flex;gap:10px;align-items:center;color:var(--mute);font-size:15px}
.scrollcue i{width:22px;height:34px;border:2px solid var(--mute);border-radius:12px;position:relative}
.scrollcue i::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--cy);animation:cue 1.8s ease-in-out infinite}
@keyframes cue{50%{transform:translateY(10px);opacity:.3}}
/* angka utama */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:36px}
.big{padding:28px 26px}
.big .n{display:block;font-size:clamp(72px,9vw,124px);line-height:.95;font-weight:800;color:var(--cy);font-variant-numeric:tabular-nums}
.big:nth-child(2) .n{color:var(--gold)}
.big strong{display:block;font-size:21px;margin-top:10px}
.big span{display:block;color:var(--mute);font-size:15px}
.units{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px}
.units i{display:block;width:10px;height:26px;border-radius:3px;background:var(--cy);opacity:0;transform:scaleY(.2);transition:opacity .35s,transform .35s;transition-delay:calc(var(--d,0) * 1s)}
.units.dot i{width:15px;height:15px;border-radius:50%;background:var(--gold)}
.units.dot i.u{background:none;border:2px dashed var(--mute)}
.units.yr i{width:auto;height:auto;padding:4px 11px;border-radius:8px;background:rgba(70,217,230,.14);border:1px solid rgba(70,217,230,.5);font-style:normal;font-size:14px;font-weight:700;color:var(--cy)}
.in .units i{opacity:1;transform:none}
/* carta lajur */
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:28px;margin-top:36px;align-items:stretch}
.chart{padding:24px 24px 18px}
.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:15px;color:#d5e1e7;margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:14px;height:14px;border-radius:4px;background:var(--cy)}
.legend i.k{background:var(--gold)}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;height:320px;align-items:end;border-bottom:1px solid rgba(255,255,255,.18);padding-top:28px}
.yrc{display:flex;justify-content:center;align-items:flex-end;gap:8px;height:100%}
.bar{position:relative;width:min(46px,40%);height:var(--h);border-radius:8px 8px 2px 2px;background:linear-gradient(180deg,var(--cy),#0a5a4a);transform:scaleY(0);transform-origin:bottom;transition:transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--d,0) * 1s)}
.bar.k{background:linear-gradient(180deg,var(--gold),#7a5a1c)}
.bar b{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:6px;font-size:18px;font-weight:800;opacity:0;transition:opacity .4s;transition-delay:calc(var(--d,0) * 1s + .6s)}
.bar.z{height:3px;background:rgba(255,255,255,.25)}
.in .bar{transform:none}.in .bar b{opacity:1}
.xl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;text-align:center;font-weight:700;padding-top:10px;font-size:17px}
.facts{padding:24px;display:flex;flex-direction:column;gap:18px}
.fact b{display:block;font-size:40px;line-height:1;color:var(--gold);font-weight:800}
.fact span{font-size:15px;color:#d5e1e7}
/* garis masa */
.tl{position:relative;margin-top:44px}
.spine{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:rgba(255,255,255,.1);border-radius:2px}
.spine i{position:absolute;inset:0;background:linear-gradient(var(--cy),var(--gold));transform-origin:top;transform:scaleY(var(--p,0));border-radius:2px}
.ev{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);align-items:center;margin-bottom:26px}
.ev .dot{grid-column:2;justify-self:center;width:22px;height:22px;border-radius:50%;background:var(--navy);border:3px solid var(--cy);box-shadow:0 0 0 0 rgba(70,217,230,.5);transition:border-color .4s,box-shadow .6s}
.ev.k .dot{border-color:var(--gold)}
.ev.in .dot{box-shadow:0 0 0 10px rgba(70,217,230,0),0 0 16px rgba(70,217,230,.45)}
.ev .card{padding:16px 20px}
.ev:nth-child(odd of .ev) .card{grid-column:1;grid-row:1}
.ev:nth-child(even of .ev) .card{grid-column:3;grid-row:1}
.ev .card .dt{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:800;font-size:19px}
.ty{font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid}
.ty.dr{color:var(--cy);border-color:rgba(70,217,230,.55)}.ty.kk{color:var(--gold);border-color:rgba(217,180,90,.55)}.ty.tn{color:var(--mute);border-color:rgba(169,189,199,.45)}
.ev .card p{margin:6px 0 0;font-size:16px;color:#d5e1e7;line-height:1.45}
.ev .card img{display:block;width:100%;height:180px;object-fit:cover;object-position:50% 30%;border-radius:10px;margin-top:10px}
/* jubin isu */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:36px}
.tile{padding:22px 22px 18px;display:flex;flex-direction:column;transition:border-color .4s,box-shadow .4s,transform .4s}
.tile:hover{border-color:rgba(70,217,230,.6);box-shadow:0 0 28px rgba(70,217,230,.16);transform:translateY(-3px)}
.th{display:flex;align-items:center;gap:12px}
.ic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:rgba(70,217,230,.1);border:1px solid rgba(70,217,230,.35)}
.ic svg{width:28px;height:28px;fill:none;stroke:var(--cy);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.in .ic{animation:ring 1.6s .3s ease-out 1}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(70,217,230,.45)}100%{box-shadow:0 0 0 18px rgba(70,217,230,0)}}
.tile .cat{font-size:14px;color:var(--gold);font-weight:600}
.tile h3{margin:2px 0 0;font-size:20px;line-height:1.2}
.kf{display:flex;align-items:baseline;gap:12px;margin:18px 0 6px}
.kf b{font-size:64px;line-height:.9;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.kf span{font-size:15px;color:var(--mute);line-height:1.25}
.tile p{margin:8px 0 0;font-size:16px;color:#d5e1e7;line-height:1.45}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.meta span{font-size:13px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);white-space:nowrap}
details{margin-top:auto;padding-top:14px}
summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid rgba(70,217,230,.45);background:rgba(70,217,230,.08);font-size:15px;font-weight:600}
summary::-webkit-details-marker{display:none}
summary:hover{background:rgba(70,217,230,.2)}
details[open] summary{border-color:var(--gold)}
.dbody{padding-top:10px;font-size:15px;line-height:1.5;color:#dbe6eb;animation:open .5s ease}
@keyframes open{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.dbody b{display:block;color:var(--cy);font-size:14px;margin-top:10px}
.dbody ul{margin:2px 0 0;padding-left:18px}
.dbody .flag{margin-top:10px;padding:8px 10px;border-radius:8px;border:1px dashed rgba(217,180,90,.6);background:rgba(217,180,90,.07);color:#f1e3bd;font-size:14px}
/* donat dan lokasi */
.donut{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:32px;align-items:center;margin-top:36px}
.dwrap{position:relative;max-width:380px;width:100%;margin:0 auto;aspect-ratio:1}
.dwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.dwrap circle{fill:none;stroke-width:26}
.dwrap .seg{stroke-dasharray:0 1000;transition:stroke-dasharray .9s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--d,0) * 1s)}
.dwrap.in .seg{stroke-dasharray:var(--len) 1000}
.dctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dctr b{font-size:72px;line-height:1;font-weight:800}
.dctr span{color:var(--mute);font-size:15px}
.mlist{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;font-size:16px}
.mrow i{width:16px;height:16px;border-radius:4px}
.mrow b{font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.chip{padding:8px 16px;border-radius:999px;border:1px solid rgba(70,217,230,.45);background:rgba(70,217,230,.08);font-size:16px;white-space:nowrap}
.chip.g{border-color:rgba(217,180,90,.55);background:rgba(217,180,90,.08)}
.chips .rv{transform:scale(.6)}
.chips .rv.in{transform:none}
/* galeri */
.gal{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;margin-top:36px}
.ph{position:relative;margin:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/10;background:#020814}
.ph:nth-child(1){grid-column:span 4;grid-row:span 2;aspect-ratio:auto}
.ph:nth-child(2),.ph:nth-child(3){grid-column:span 2}
.ph:nth-child(4),.ph:nth-child(5){grid-column:span 3}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;transform:scale(1.08);transition:transform 6s ease-out}
.ph.in img{transform:scale(1)}
.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 10px;background:linear-gradient(transparent,rgba(2,8,20,.92));font-size:14px;line-height:1.35}
.ph figcaption b{display:block;color:var(--gold);font-size:15px}
/* sorotan */
.flowc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px;margin-top:36px}
.fc{padding:26px;position:relative}
.fc .lb{display:block;font-weight:700;margin-bottom:8px}
.fc p{margin:0;font-size:19px;line-height:1.45}
.fc.y{border-color:rgba(70,217,230,.55)}.fc.y .lb{color:var(--cy)}
.fc.k{border-color:rgba(201,183,255,.45)}.fc.k .lb{color:var(--vio)}
.fc.t{border-color:rgba(217,180,90,.55)}.fc.t .lb{color:var(--gold)}
.fc+.fc::before{content:"";position:absolute;left:-40px;top:50%;width:32px;height:2px;background:var(--mute);transform:scaleX(0);transform-origin:left;transition:transform .5s;transition-delay:calc(var(--d,0) * 1s)}
.fc.in+.fc.in::before{transform:none}
.span{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;margin-top:30px}
.span b{font-size:20px}.span small{display:block;color:var(--mute);font-size:14px}
.span .sl{position:relative;height:30px}
.span .sl::before{content:"";position:absolute;left:0;right:0;top:14px;height:3px;background:linear-gradient(90deg,var(--cy),var(--gold));transform:scaleX(0);transform-origin:left;transition:transform 1.2s .3s ease-out}
.span.in .sl::before{transform:none}
.span .sl em{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-style:normal;color:var(--gold);font-weight:700;white-space:nowrap;font-size:15px}
/* sumber */
.srcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:30px}
.srcs .panel{padding:22px}
.srcs h3{margin:0 0 8px;font-size:17px;color:var(--cy)}
.srcs ul{margin:0;padding-left:20px}
.srcs li{font-size:15px;margin:5px 0;color:#dbe6eb}
footer{padding:30px 0 90px;color:var(--mute);font-size:14px;text-align:center}
.ctl{position:fixed;right:16px;bottom:16px;z-index:5;display:flex;gap:8px}
.ctl button{min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid rgba(70,217,230,.45);background:rgba(6,18,38,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:14px;font-weight:600}
.prog{position:fixed;left:0;top:0;height:3px;width:100%;z-index:6;background:linear-gradient(90deg,var(--cy),var(--gold));transform-origin:left;transform:scaleX(var(--sp,0))}
/* jeda dan kurang gerakan */
html.still .rv,html.still .units i,html.still .bar,html.still .bar b,html.still .dwrap .seg,html.still .ph img,html.still .span .sl::before,html.still .fc+.fc::before{transition:none!important}
html.still .rv{opacity:1;transform:none}
html.still .units i,html.still .bar b{opacity:1;transform:none}
html.still .bar{transform:none}
html.still .dwrap .seg{stroke-dasharray:var(--len) 1000}
html.still .ph img{transform:none}
html.still .span .sl::before,html.still .fc+.fc::before{transform:none}
html.still .ln,html.still .port .star,html.still .scrollcue i::after{animation-play-state:paused}
html.still h1{animation:none;background-position:0 0}
html.still .ic{animation:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.ln,.port .star,.scrollcue i::after,.ic{animation:none!important}}
@media(max-width:860px){
 .hgrid,.two,.donut{grid-template-columns:minmax(0,1fr)}
 .port{order:-1;height:380px}
 .namep{margin-bottom:20px}
 .trio,.tiles,.flowc,.srcs{grid-template-columns:minmax(0,1fr)}
 .flowc{gap:16px}.fc+.fc::before{display:none}
 .tiles{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
 .spine{left:11px}
 .ev{grid-template-columns:24px minmax(0,1fr);gap:14px}
 .ev .dot{grid-column:1;justify-self:start;margin-left:0}
 .ev:nth-child(odd of .ev) .card,.ev:nth-child(even of .ev) .card{grid-column:2}
 .gal{grid-template-columns:repeat(2,minmax(0,1fr))}
 .ph:nth-child(n){grid-column:span 1;grid-row:auto;aspect-ratio:16/10}
 .ph:nth-child(1){grid-column:span 2}
 .span{grid-template-columns:minmax(0,1fr)}
 .cols{height:260px;gap:10px}
}
@media print{
 body{background:#061226;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .bgfx,.ctl,.prog,.scrollcue{display:none}
 .rv,.units i,.bar,.bar b{opacity:1!important;transform:none!important;transition:none!important}
 .dwrap .seg{stroke-dasharray:var(--len) 1000!important}
 details .dbody{display:block}
 section{break-inside:avoid-page}
 h1{animation:none;background-position:0 0}
}
</style>
</head>
<body>
<div class="prog" id="prog" aria-hidden="true"></div>
<div class="bgfx" aria-hidden="true"><div class="grid"></div>
 <svg viewBox="0 0 1600 900" preserveAspectRatio="none"><path class="ln" d="M-20 250 C 400 210, 700 300, 1620 230"/><path class="ln" d="M-20 610 C 500 560, 900 680, 1620 590"/><path class="ln g" d="M-20 820 C 600 760, 1000 860, 1620 790"/><path class="ln g" d="M-10 120 L 300 120 L 340 160 L 640 160"/></svg></div>
<main id="main"></main>
<div class="ctl"><button id="pause" type="button" aria-pressed="false">Jeda animasi</button><button id="top" type="button" aria-label="Kembali ke atas">↑ Atas</button></div>

<script>

const $=id=>document.getElementById(id),root=document.documentElement;
$('main').innerHTML=html;
if(matchMedia('(prefers-reduced-motion: reduce)').matches)root.classList.add('still');

function countUp(el){const to=+el.dataset.to;if(root.classList.contains('still')){el.textContent=to;return}const t0=performance.now()+200,D=900;const st=n=>{const p=Math.min(1,Math.max(0,(n-t0)/D));el.textContent=Math.round(to*(1-(1-p)**3));if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const t=e.target;t.classList.add('in');t.querySelectorAll('[data-to]').forEach(countUp);if(t.matches('[data-to]'))countUp(t);io.unobserve(t)}),{threshold:.18,rootMargin:'0px 0px -6% 0px'});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
document.querySelectorAll('[data-to]').forEach(el=>{if(!el.closest('.rv'))io.observe(el)});

let tick=false;
function onScroll(){tick=false;const h=document.documentElement.scrollHeight-innerHeight;$('prog').style.setProperty('--sp',h>0?(scrollY/h).toFixed(4):0);
 const tl=$('tl').getBoundingClientRect();const p=Math.min(1,Math.max(0,(innerHeight*.65-tl.top)/tl.height));$('spine').style.setProperty('--p',root.classList.contains('still')?1:p.toFixed(4));
 if(!root.classList.contains('still')){const y=Math.min(scrollY,600);$('pimg').style.setProperty('--py',(y*.12).toFixed(1)+'px')}}
addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(onScroll)}},{passive:true});
addEventListener('resize',onScroll);onScroll();

function sync(){const s=root.classList.contains('still');$('pause').textContent=s?'Sambung animasi':'Jeda animasi';$('pause').setAttribute('aria-pressed',String(s))}
$('pause').addEventListener('click',()=>{root.classList.toggle('still');if(root.classList.contains('still')){document.querySelectorAll('.rv').forEach(e=>e.classList.add('in'));document.querySelectorAll('[data-to]').forEach(e=>e.textContent=e.dataset.to);$('pimg').style.setProperty('--py','0px')}onScroll();sync()});sync();
if(root.classList.contains('still')){document.querySelectorAll('.rv').forEach(e=>e.classList.add('in'));document.querySelectorAll('[data-to]').forEach(e=>e.textContent=e.dataset.to)}
$('top').addEventListener('click',()=>scrollTo({top:0,behavior:root.classList.contains('still')?'auto':'smooth'}));
addEventListener('beforeprint',()=>{document.querySelectorAll('.rv').forEach(e=>e.classList.add('in'));document.querySelectorAll('[data-to]').forEach(e=>e.textContent=e.dataset.to);document.querySelectorAll('details').forEach(x=>x.open=true)});
}
</script>
